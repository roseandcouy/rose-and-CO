<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Producto | Rosé & Co.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=Parisienne&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="topbar">
    ✧ Productos originales importados desde Estados Unidos ✧
    &nbsp;|&nbsp;
    Demora aproximada: 1 mes ✈
  </div>

  <header class="header">
    <a class="logo" href="index.html">
      <span>ROSÉ & CO.</span>
      <small>BEAUTY IMPORTED FROM THE USA</small>
    </a>
  </header>

  <main class="product-page">

    <button
      class="back-button"
      onclick="window.location.href='index.html#tienda'"
    >
      ← Volver a la tienda
    </button>

    <div id="productDetail"></div>

  </main>

  <script>

    const products = [
      {
        id:1,
        name:"Pocket Bronze Long",
        brand:"Rhode",
        category:"Maquillaje",
        price:2190,
        images:[
          "s2981116-main-zoom.jpg.webp"
        ],
        description:"Bronceador en crema de larga duración que proporciona un color hidratante y edificable y se mezcla sin problemas, añadiendo calidez bañada por el sol y una dimensión suave."
      },

      {
        id:2,
        name:"Body Mist",
        brand:"Sol de Janeiro",
        category:"Body Care",
        price:1650,
        type:"bottle",
        description:"Body mist perfumado de Sol de Janeiro."
      },

      {
        id:3,
        name:"Setting Spray",
        brand:"Charlotte Tilbury",
        category:"Maquillaje",
        price:2290,
        type:"bottle",
        description:"Spray fijador de maquillaje de Charlotte Tilbury."
      },

      {
        id:4,
        name:"Eyeshadow Palette",
        brand:"Huda Beauty",
        category:"Maquillaje",
        price:3490,
        type:"flat",
        description:"Paleta de sombras de Huda Beauty."
      },

      {
        id:5,
        name:"Lip Butter Balm",
        brand:"Summer Fridays",
        category:"Skincare",
        price:1790,
        type:"bottle",
        description:"Bálsamo labial hidratante de Summer Fridays."
      },

      {
        id:6,
        name:"Lip Sleeping Mask",
        brand:"Laneige",
        category:"Skincare",
        price:1490,
        type:"round",
        description:"Mascarilla hidratante para labios de Laneige."
      },

      {
        id:7,
        name:"Eau de Parfum",
        brand:"Marc Jacobs",
        category:"Perfumes",
        price:3290,
        type:"bottle",
        description:"Eau de Parfum de Marc Jacobs."
      },

      {
        id:8,
        name:"Hydrating Cream",
        brand:"Tatcha",
        category:"Skincare",
        price:3890,
        type:"round",
        description:"Crema hidratante de Tatcha."
      }
    ];

    const money = n => "$U " + n.toLocaleString("es-UY");

    const params = new URLSearchParams(window.location.search);
    const id = Number(params.get("id"));

    const product = products.find(p => p.id === id);

    const container = document.getElementById("productDetail");

    if(product){

      const images =
        product.images && product.images.length
          ? product.images
          : [];

      container.innerHTML = `

        <div class="product-detail">

          <div class="product-gallery">

            ${
              images.length
                ? `
                  <div class="main-product-image">
                    <button class="gallery-arrow left" onclick="previousImage()">‹</button>

                    <img
                      id="mainProductImage"
                      src="${images[0]}"
                      alt="${product.brand} ${product.name}"
                    >

                    <button class="gallery-arrow right" onclick="nextImage()">›</button>
                  </div>

                  ${
                    images.length > 1
                      ? `
                        <div class="product-thumbnails">

                          ${images.map((img,index) => `
                            <button
                              class="${index === 0 ? "active" : ""}"
                              onclick="selectImage(${index})"
                            >
                              <img
                                src="${img}"
                                alt="Foto ${index + 1}"
                              >
                            </button>
                          `).join("")}

                        </div>
                      `
                      : ""
                  }
                `
                : `
                  <div class="product-no-image">
                    Rosé & Co.
                  </div>
                `
            }

          </div>


          <div class="product-detail-info">

            <div class="category-name">
              ${product.category}
            </div>

            <h1>
              ${product.brand} ${product.name}
            </h1>

            <div class="price product-detail-price">
              ${money(product.price)}
            </div>

            <p class="product-full-description">
              ${product.description}
            </p>

            <button
              class="add product-add"
              onclick="addProductToCart(${product.id})"
            >
              ♡ AGREGAR AL CARRITO
            </button>

          </div>

        </div>
      `;

      window.productImages = images;
      window.currentImageIndex = 0;

    } else {

      container.innerHTML = `
        <p class="product-not-found">
          Producto no encontrado.
        </p>
      `;

    }


    function updateMainImage(){

      const image = document.getElementById("mainProductImage");

      if(!image) return;

      image.src = window.productImages[window.currentImageIndex];

      document
        .querySelectorAll(".product-thumbnails button")
        .forEach((btn,index) => {
          btn.classList.toggle(
            "active",
            index === window.currentImageIndex
          );
        });
    }


    function selectImage(index){

      window.currentImageIndex = index;

      updateMainImage();
    }


    function nextImage(){

      if(!window.productImages.length) return;

      window.currentImageIndex =
        (window.currentImageIndex + 1)
        % window.productImages.length;

      updateMainImage();
    }


    function previousImage(){

      if(!window.productImages.length) return;

      window.currentImageIndex =
        (
          window.currentImageIndex
          - 1
          + window.productImages.length
        )
        % window.productImages.length;

      updateMainImage();
    }


    function addProductToCart(id){

      let cart = JSON.parse(
        localStorage.getItem("roseCart") || "[]"
      );

      const found = cart.find(i => i.id === id);

      if(found){

        found.qty++;

      }else{

        cart.push({
          id:id,
          qty:1
        });

      }

      localStorage.setItem(
        "roseCart",
        JSON.stringify(cart)
      );

      alert("Producto agregado al carrito ♡");
    }

  </script>

</body>

</html>
